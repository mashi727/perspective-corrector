name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-uv は v8 以降、移動するメジャータグ（v8, v9）を発行していないため、
      # 完全なバージョン番号で指定する必要がある
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Verify icon files
        shell: bash
        run: |
          echo "Checking icon files..."
          ls -la icon.*
          if [ -f "icon.ico" ]; then echo "✓ icon.ico found"; else echo "✗ icon.ico NOT found"; exit 1; fi

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller perspective_corrector.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PerspectiveCorrector-Windows
          path: dist/PerspectiveCorrector.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-uv は v8 以降、移動するメジャータグ（v8, v9）を発行していないため、
      # 完全なバージョン番号で指定する必要がある
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Verify icon files
        run: |
          echo "Checking icon files..."
          ls -la icon.*
          if [ -f "icon.icns" ]; then echo "✓ icon.icns found"; else echo "✗ icon.icns NOT found"; exit 1; fi

      - name: Build app with PyInstaller
        run: |
          uv run pyinstaller perspective_corrector.spec --noconfirm

      - name: Verify icon in app bundle
        run: |
          echo "Checking icon in app bundle..."
          ls -la dist/PerspectiveCorrector.app/Contents/Resources/*.icns || echo "No icns in Resources"
          cat dist/PerspectiveCorrector.app/Contents/Info.plist | grep -A1 CFBundleIconFile || echo "No icon reference in Info.plist"

      - name: Create DMG
        run: |
          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -r dist/PerspectiveCorrector.app dmg_contents/

          # Create DMG
          hdiutil create -volname "PerspectiveCorrector" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            dist/PerspectiveCorrector.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PerspectiveCorrector-macOS
          path: dist/PerspectiveCorrector.dmg
          retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: PerspectiveCorrector-Windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: PerspectiveCorrector-macOS
          path: artifacts/macos

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows/PerspectiveCorrector.exe
            artifacts/macos/PerspectiveCorrector.dmg

      - name: Create Release (manual)
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: manual-${{ github.run_number }}
          name: Manual Build ${{ github.run_number }}
          draft: true
          prerelease: true
          files: |
            artifacts/windows/PerspectiveCorrector.exe
            artifacts/macos/PerspectiveCorrector.dmg
